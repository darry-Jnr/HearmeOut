<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <title>HearMe Out</title>
  </head>
  <body>
    <main class="app">
      <!-- Camera view with the hand skeleton drawn on top -->
      <section class="camera-box">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="cameraHint" class="camera-hint">Sign toward the camera</div>
      </section>

      <!-- What the app heard you sign (then it speaks this) -->
      <section class="said-box">
        <div class="label">You said</div>
        <div id="youSaid" class="big-text">—</div>
      </section>

      <!-- What the other person said, live captions -->
      <section class="heard-box">
        <div class="label">They said</div>
        <div id="theySaid" class="big-text">—</div>
      </section>

      <!-- Quick phrases: always works, even if the AI misses a sign -->
      <section class="phrases">
        <button data-phrase="Hello!">Hello</button>
        <button data-phrase="Thank you!">Thank you</button>
        <button data-phrase="Yes">Yes</button>
        <button data-phrase="No">No</button>
        <button data-phrase="I need help">Help</button>
        <button data-phrase="I love you">I love you</button>
        <button data-phrase="Please wait">Wait</button>
        <button data-phrase="Nice to meet you!">Nice</button>
      </section>

      <!-- Controls -->
      <section class="controls">
        <button id="startBtn" class="start-btn">Start</button>
        <label class="toggle">
          <input type="checkbox" id="autoSpeak" checked />
          Auto-speak my signs
        </label>
        <label class="toggle">
          <input type="checkbox" id="listenToggle" checked />
          Captions on
        </label>
      </section>

      <!-- Status line: model loading, errors, etc. -->
      <footer id="status" class="status">Loading…</footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
